<div class="container">

  <div class="card">

    <div class="header">
      <h2>Employee Registration</h2>
      <p>Join our hospital management team</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="grid">

        <!-- Name -->
        <div class="form-group">

          <label>Full Name *</label>

          <input type="text" formControlName="name" placeholder="John Doe" />

          <small *ngIf="
              registerForm.get('name')?.invalid &&
              registerForm.get('name')?.touched
            ">
            Name is required
          </small>

        </div>

        <!-- Email -->
        <div class="form-group">

          <label>Email *</label>

          <input type="email" formControlName="email" placeholder="john@example.com" />

          <small *ngIf="
              registerForm.get('email')?.invalid &&
              registerForm.get('email')?.touched
            ">
            Valid email is required
          </small>

        </div>

        <!-- Phone -->
        <div class="form-group">

          <label>Phone *</label>

          <input type="tel" formControlName="phone" placeholder="9876543210" />

          <small *ngIf="
              registerForm.get('phone')?.invalid &&
              registerForm.get('phone')?.touched
            ">
            Valid phone number is required
          </small>

        </div>

        <!-- Department -->
        <div class="form-group">

          <label>Department *</label>

          <select formControlName="department">

            <option value="">
              Select Department
            </option>

            <option *ngFor="let dept of departments" [value]="dept">
              {{ dept }}
            </option>

          </select>

        </div>

        <!-- Designation -->
        <div class="form-group">

          <label>Designation *</label>

          <select formControlName="designation" (change)="onDesignationChange()">

            <option value="">
              Select Designation
            </option>

            <option *ngFor="let designation of designations" [value]="designation">
              {{ designation }}
            </option>

          </select>

        </div>

        <!-- Joining Date -->
        <div class="form-group">

          <label>Joining Date *</label>

          <input type="date" formControlName="joiningDate" />

        </div>

        <!-- Medical Registration Number -->
        <div class="form-group" *ngIf="showMedicalFields">

          <label>Medical Registration Number</label>

          <input type="text" formControlName="medicalRegistrationNumber" placeholder="MED12345" />

        </div>

        <!-- Qualification -->
        <div class="form-group" *ngIf="showQualification ">

          <label>Qualification</label>

          <input type="text" formControlName="qualification" placeholder="Eg MBBS,Bsc,Bcom" />

        </div>

        <!-- Specialisation -->
        <div class="form-group" *ngIf="showSpecialisation">

          <label>Specialisation</label>

          <input type="text" formControlName="specialisation" placeholder="Cardiology" />

        </div>

      </div>
      <!-- Password -->
      <div class="form-group">

        <label>Password *</label>

        <input type="password" formControlName="password" placeholder="Enter password" />

        <small *ngIf="
      registerForm.get('password')?.invalid &&
      registerForm.get('password')?.touched
    ">
          Password must be at least 6 characters
        </small>

      </div>

      <!-- Confirm Password -->
      <div class="form-group">

        <label>Confirm Password *</label>

        <input type="password" formControlName="confirmPassword" placeholder="Confirm password" />

        <small *ngIf="
      registerForm.hasError('passwordMismatch') &&
      registerForm.get('confirmPassword')?.touched
    ">
          Passwords do not match
        </small>

      </div>

      <button type="submit" [disabled]="registerForm.invalid">
        Submit Registration Request
      </button>

    </form>

  </div>

</div>
